name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_data:
        description: Run the public xyz real-data smoke experiment
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
      - run: python -m pip check
      - name: Synthetic geometry, failure and metric tests
        run: python -m unittest discover -s tests -v
      - name: Check published experiment integrity
        run: python scripts/check_report.py
  real-data:
    if: github.event_name == 'workflow_dispatch' && inputs.real_data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
      - run: python scripts/download_data.py --sequences xyz
      - run: python -m depthtrack.cli smoke --sequences xyz --out data/real-smoke
      - run: python scripts/check_smoke.py data/real-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-smoke
          path: data/real-smoke
